spring:
  application:
    name: auth-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (set by Aspire or your environment).
  mvc:
    problemdetails:
      enabled: false              # we use our own ApiError envelope
  servlet:
    multipart:
      enabled: false

server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  tomcat:
    max-swallow-size: 64KB
    max-http-form-post-size: 64KB

# --- Application settings (see AppProperties) -------------------------------------------------------
app:
  jwt:
    private-key: ${APP_JWT_PRIVATE_KEY:}   # Base64 PKCS#8 RSA key; required unless allow-ephemeral-key (dev/test). Never commit.
    issuer: auth-api
    access-ttl: 10m
  refresh:
    ttl: 14d
    cookie-name: refresh_token
    cookie-path: /api/auth
    cookie-secure: true                    # HTTPS only; dev profile relaxes this for http://localhost
    cookie-same-site: Strict
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}   # comma separated, explicit origins only
  lockout:
    max-failed-attempts: 5
    duration: 15m
  rate-limit:
    enabled: true
    login:    { capacity: 10, window: 1m }
    register: { capacity: 5,  window: 10m }
    refresh:  { capacity: 30, window: 1m }
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# --- API docs: OFF by default, enabled by the dev profile ---------------------------------------------
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
scalar:
  enabled: false
  telemetry: false

# --- Actuator: health only -----------------------------------------------------------------------------
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true                      # /actuator/health/liveness and /readiness
      show-details: never
      show-components: never
  health:
    readinessstate.enabled: true
    livenessstate.enabled: true

logging:
  level:
    root: INFO
