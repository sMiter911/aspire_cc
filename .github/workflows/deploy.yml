name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase: ghcr.io/<owner>/<repo>/<service>
      - name: Compute image prefix
        run: echo "PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Todo API has no Dockerfile: the .NET SDK builds the image itself (reads the docker login above).
      - name: todo-api
        run: >
          dotnet publish TodoApi/TodoApi.csproj -c Release -t:PublishContainer
          -p:ContainerRegistry=${REGISTRY}
          -p:ContainerRepository=${GITHUB_REPOSITORY,,}/todo-api
          -p:ContainerImageTags='"latest;${{ github.sha }}"'

      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.PREFIX }}/backend:latest
            ${{ env.PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: todo-worker
        uses: docker/build-push-action@v6
        with:
          context: todo-worker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.PREFIX }}/todo-worker:latest
            ${{ env.PREFIX }}/todo-worker:${{ github.sha }}
          cache-from: type=gha,scope=todo-worker
          cache-to: type=gha,mode=max,scope=todo-worker

      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.PREFIX }}/frontend:latest
            ${{ env.PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: postgres (databases created on first start)
        uses: docker/build-push-action@v6
        with:
          context: database/postgres
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.PREFIX }}/postgres:latest
            ${{ env.PREFIX }}/postgres:${{ github.sha }}

      - name: messaging (RabbitMQ with baked topology)
        uses: docker/build-push-action@v6
        with:
          context: messaging/rabbitmq
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.PREFIX }}/messaging:latest
            ${{ env.PREFIX }}/messaging:${{ github.sha }}

  # Informational: fails when deploy/docker-compose.yaml no longer matches the AppHost. Regenerate with
  #   aspire publish -o deploy
  compose-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
      - run: aspire publish -o deploy
      - run: git diff --exit-code -- deploy/docker-compose.yaml
